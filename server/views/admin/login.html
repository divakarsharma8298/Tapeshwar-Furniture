<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Tapeshwar Furniture</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5efe2;
        color: #241811;
      }
      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(100%, 420px);
        background: #fffaf1;
        border: 1px solid rgba(42, 27, 18, 0.12);
        padding: 32px 28px;
        box-shadow: 0 16px 40px rgba(42,27,18,0.08);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
        color: #2a1b12;
      }
      p {
        margin: 0 0 24px;
        color: #5a4736;
      }
      .field {
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        min-height: 46px;
        border: 1px solid rgba(42,27,18,0.18);
        padding: 10px 12px;
        font-size: 15px;
      }
      button {
        width: 100%;
        min-height: 48px;
        border: none;
        background: #2a1b12;
        color: #f5efe2;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #8b4a2b;
      }
      .alert {
        display: none;
        margin-top: 16px;
        padding: 10px 12px;
        border: 1px solid #d6af97;
        background: #f4e3d9;
        color: #7a3120;
      }
      .alert.show {
        display: block;
      }
      .meta {
        margin-top: 18px;
        font-size: 12px;
        color: #5a4736;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1>Admin Login</h1>
        <p>Tapeshwar Furniture enquiry dashboard</p>
        <form id="login-form">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required />
          </div>
          <button type="submit">Log In</button>
          <div id="login-alert" class="alert" role="alert"></div>
        </form>
        <div class="meta">Default admin email and password are configured in the server environment.</div>
      </div>
    </div>

    <script>
      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('login-alert');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();
          if (!response.ok || !data.success) {
            alertBox.textContent = data.message || 'Login failed.';
            alertBox.classList.add('show');
            return;
          }

          window.location.href = '/admin';
        } catch (error) {
          alertBox.textContent = 'Unable to log in right now. Please try again.';
          alertBox.classList.add('show');
        }
      });
    </script>
  </body>
</html>
