services:
  - type: web
    name: tapeshwar-furniture-admin
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: tapeshwar-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: DATABASE_PATH
        value: /var/data/tapeshwar-furniture.db
      - key: SESSION_DB_PATH
        value: /var/data/sessions.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
